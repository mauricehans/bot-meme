<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Suivi funding SOL</title>
    <style>
        body { margin: 0; font-family: system-ui, Arial; background: #0b1220; color: #e5e7eb; }
        header { padding: 16px 20px; background: #111c30; border-bottom: 1px solid #334155; }
        main { padding: 20px; }
        a { color: #60a5fa; }
        button, input, select { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #475569; }
        button { background: #1e3a5f; color: white; cursor: pointer; }
        form { display: grid; gap: 10px; max-width: 520px; }
        .card { background: #111c30; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
        .dev { color: #60a5fa; font-weight: bold; }
        .tampon { color: #cbd5e1; font-weight: bold; }
    </style>
</head>
<body>
<header>
    <h1>Suivi funding SOL</h1>
    <a href="{% url 'home' %}">Mes suivis</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
